# 在 VPS 本机启动 HAProxy 时，由受限 EnvironmentFile 提供这些变量。
# EDGE_BIND_ADDRESS：VPS 实际网卡 IPv4（云主机可能使用 NAT 私网地址）。
# VAULT_DOMAIN / NOTES_DOMAIN：目标域名。
# EXISTING_TLS_ADDRESS：原有网站的回环 TLS 监听地址，如 127.0.0.1:443。
global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 10s
    timeout client 1h
    timeout server 1h

frontend tls_in
    bind "${EDGE_BIND_ADDRESS}:443"
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl nas_vault req.ssl_sni -i "${VAULT_DOMAIN}"
    acl nas_notes req.ssl_sni -i "${NOTES_DOMAIN}"
    use_backend nas_tls if nas_vault or nas_notes
    default_backend existing_tls

backend nas_tls
    server nas "${NAS_TAILSCALE_IP}:${NAS_TLS_PORT}" check

backend existing_tls
    server existing "${EXISTING_TLS_ADDRESS}" check
