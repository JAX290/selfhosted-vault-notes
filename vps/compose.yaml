name: vault-notes-edge

services:
  tcp-gateway:
    image: ${HAPROXY_IMAGE}
    container_name: vault-notes-edge
    restart: unless-stopped
    environment:
      NAS_TAILSCALE_IP: ${NAS_TAILSCALE_IP:?set NAS_TAILSCALE_IP in .env}
      NAS_TLS_PORT: ${NAS_TLS_PORT:-8443}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
