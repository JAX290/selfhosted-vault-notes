global
    log stdout format raw local0

defaults
    log global
    timeout connect 10s
    timeout client 1h
    timeout server 1h

frontend tls_in
    mode tcp
    bind "${EDGE_BIND_ADDRESS}:443"
    default_backend nas_tls

backend nas_tls
    mode tcp
    server nas "${NAS_TAILSCALE_IP}:${NAS_TLS_PORT}" check

frontend http_in
    mode http
    bind "${EDGE_BIND_ADDRESS}:80"
    http-request redirect scheme https code 308
