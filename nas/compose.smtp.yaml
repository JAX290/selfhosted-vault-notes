# 仅在填写完整 SMTP 配置后使用：
# docker compose -f compose.yaml -f compose.smtp.yaml up -d
services:
  vaultwarden:
    environment:
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
