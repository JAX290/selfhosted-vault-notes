name: vault-notes

services:
  caddy:
    build:
      context: ./caddy
      args:
        CADDY_VERSION: "2.11.4"
        CLOUDFLARE_PLUGIN_VERSION: "v0.2.4"
    image: local/caddy-cloudflare:2.11.4
    container_name: vault-notes-caddy
    restart: unless-stopped
    environment:
      VAULT_DOMAIN: ${VAULT_DOMAIN:?set VAULT_DOMAIN in .env}
      NOTES_DOMAIN: ${NOTES_DOMAIN:?set NOTES_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - 'export CF_API_TOKEN="$$(cat /run/secrets/cloudflare-token)"; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports:
      - "127.0.0.1:18443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./secrets/cloudflare-token.txt:/run/secrets/cloudflare-token:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      vaultwarden:
        condition: service_started
      joplin:
        condition: service_started
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true

  vaultwarden:
    image: ${VAULTWARDEN_IMAGE}
    container_name: vault-notes-vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://${VAULT_DOMAIN}
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      LOG_LEVEL: warn
      EXTENDED_LOGGING: "true"
    volumes:
      - ./data/vaultwarden:/data
    expose:
      - "80"
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true

  joplin:
    image: ${JOPLIN_IMAGE}
    container_name: vault-notes-joplin
    restart: unless-stopped
    environment:
      APP_PORT: "22300"
      APP_BASE_URL: https://${NOTES_DOMAIN}
      DB_CLIENT: pg
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: ${JOPLIN_DB_NAME}
      POSTGRES_USER: ${JOPLIN_DB_USER}
      POSTGRES_PASSWORD: ${JOPLIN_DB_PASSWORD}
    expose:
      - "22300"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - database
    security_opt:
      - no-new-privileges:true

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: vault-notes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JOPLIN_DB_NAME}
      POSTGRES_USER: ${JOPLIN_DB_USER}
      POSTGRES_PASSWORD: ${JOPLIN_DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - database
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
  database:
    internal: true
